<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Queue Monitoring System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <!-- Microsoft MSAL.js -->
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #05060A;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #backLink {
            position: fixed;
            top: 16px;
            left: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.5);
            font-family: Orbitron, sans-serif;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
            transition: color 0.2s ease;
            z-index: 100;
        }
        #backLink:hover { color: white; }
        #backArrow { font-size: 1.1rem; line-height: 1; }

        .login-wrap {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .login-title {
            font-family: Orbitron, sans-serif;
            font-size: clamp(1.4rem, 5vw, 2rem);
            line-height: 1.2;
        }

        .login-sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
        }

        .admin-badge {
            display: inline-block;
            font-size: 0.68rem;
            font-family: Orbitron, sans-serif;
            background-color: rgb(14, 183, 70);
            color: #05060A;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        .login-card {
            width: 100%;
            border: 2px solid white;
            border-radius: 20px;
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center;
        }

        /* Microsoft sign-in button */
        #msBtn {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: white;
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        #msBtn:hover   { background: #f0f0f0; transform: translateY(-1px); }
        #msBtn:active  { transform: scale(0.98); }
        #msBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .ms-logo {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }

        #errorMsg {
            font-size: 0.82rem;
            color: rgb(220, 53, 69);
            text-align: center;
            display: none;
            font-family: Arial, sans-serif;
        }

        #loadingMsg {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            display: none;
            font-family: Orbitron, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
        }

        @media (max-width: 480px) {
            .login-card { padding: 28px 18px; }
        }
    </style>
</head>
<body>

    <a href="./main.html" id="backLink">
        <span id="backArrow">&#8592;</span>
        <span>Back</span>
    </a>

    <div class="login-wrap">

        <div class="login-header">
            <div class="login-title">QUEUE MONITORING<br>SYSTEM</div>
            <span class="admin-badge">ADMIN ACCESS</span>
            <p class="login-sub">Sign in with your Microsoft account</p>
        </div>

        <div class="login-card">
            <button type="button" id="msBtn" onclick="signIn()">
                <svg class="ms-logo" viewBox="0 0 21 21" xmlns="http://www.w3.org/2000/svg">
                    <rect x="1"  y="1"  width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1"  width="9" height="9" fill="#7fba00"/>
                    <rect x="1"  y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft
            </button>

            <p id="errorMsg">Sign-in failed. Please try again.</p>
            <p id="loadingMsg">REDIRECTING TO MICROSOFT...</p>
        </div>

    </div>

    <script>
        // ── MSAL Configuration ──
        const msalConfig = {
            auth: {
                clientId:    "023f3ebd-fd48-4770-b359-7299300764c7",
                authority:   "https://login.microsoftonline.com/5582e4ba-e088-4875-abf6-19f443f2815e",
                redirectUri: window.location.origin + "/html/admin_standalone.html"
            },
            cache: {
                cacheLocation: "sessionStorage",
                storeAuthStateInCookie: false
            }
        };

        const loginRequest = {
            scopes: ["User.Read", "openid", "profile", "email"]
        };

        // ── Create and initialize MSAL, then wire up the button ──
        let msalInstance = null;

        async function bootMsal() {
            try {
                msalInstance = new msal.PublicClientApplication(msalConfig);
                await msalInstance.initialize();

                // Handle redirect coming back from Microsoft
                await msalInstance.handleRedirectPromise();

                // Already signed in — skip login page
                const accounts = msalInstance.getAllAccounts();
                if (accounts.length > 0) {
                    window.location.href = "./admin_standalone.html";
                    return;
                }

                // Ready — enable the button
                document.getElementById("msBtn").disabled = false;

            } catch (e) {
                console.error("MSAL boot error:", e);
                const err = document.getElementById("errorMsg");
                err.textContent = "Initialization error: " + e.message;
                err.style.display = "block";
            }
        }

        // ── Sign in ──
        async function signIn() {
            if (!msalInstance) return;
            const btn     = document.getElementById("msBtn");
            const loading = document.getElementById("loadingMsg");
            const err     = document.getElementById("errorMsg");

            btn.disabled = true;
            loading.style.display = "block";
            err.style.display = "none";

            try {
                await msalInstance.loginRedirect(loginRequest);
            } catch (e) {
                console.error("Login error:", e);
                err.textContent = "Sign-in failed: " + (e.message || "Please try again.");
                err.style.display = "block";
                loading.style.display = "none";
                btn.disabled = false;
            }
        }

        // ── Enter key ──
        document.addEventListener("keydown", e => {
            if (e.key === "Enter") signIn();
        });

        // ── Disable button until MSAL is ready, then boot ──
        document.getElementById("msBtn").disabled = true;
        bootMsal();
    </script>

</body>
</html>
